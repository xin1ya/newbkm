<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>翠澜群岛 · 宝可梦模型展示台</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10151f; color: #e8ecf3; font: 13px/1.45 system-ui, "Microsoft YaHei", sans-serif; }
      #side { position: fixed; left: 0; top: 0; bottom: 0; width: 290px; background: #171d2a; border-right: 1px solid #2a3245; display: flex; flex-direction: column; }
      #side header { padding: 12px 12px 8px; border-bottom: 1px solid #2a3245; }
      #side header b { font-size: 16px; letter-spacing: .08em; }
      #side input, #side select { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 5px 8px; background: #0f1420; color: #e8ecf3; border: 1px solid #34405a; border-radius: 4px; }
      #stats { font-size: 12px; opacity: .8; margin-top: 6px; }
      #list { flex: 1; overflow-y: auto; }
      .it { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; border-bottom: 1px solid #1f2636; }
      .it:hover { background: #1f2738; } .it.on { background: #2b3a5c; }
      .it .no { font: 12px monospace; opacity: .6; width: 30px; } .it .nm { flex: 1; } .it .nm small { opacity: .55; margin-left: 4px; }
      .it .st { width: 18px; text-align: center; }
      #view { position: fixed; left: 290px; right: 320px; top: 0; bottom: 0; }
      #title { position: fixed; left: 306px; top: 12px; pointer-events: none; text-shadow: 0 1px 3px #000; }
      #title b { font-size: 22px; } #title div { opacity: .8; font-size: 12px; margin-top: 2px; }
      #help { position: fixed; left: 306px; bottom: 10px; font-size: 11px; opacity: .55; pointer-events: none; }
      #panel { position: fixed; right: 0; top: 0; bottom: 0; width: 320px; background: #171d2a; border-left: 1px solid #2a3245; overflow-y: auto; padding: 12px; box-sizing: border-box; }
      h3 { margin: 14px 0 6px; font-size: 13px; opacity: .75; font-weight: 600; } h3:first-child { margin-top: 0; }
      .clips { display: flex; flex-wrap: wrap; gap: 4px; }
      button { background: #26304a; color: #e8ecf3; border: 1px solid #3a4766; border-radius: 4px; padding: 4px 8px; cursor: pointer; font: inherit; font-size: 12px; }
      button:hover { background: #31406a; } button.on { background: #3f6ad8; border-color: #6c90ff; }
      .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; } .row label { flex: 1; } .row input[type=range] { flex: 2; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; } td { padding: 2px 0; } td:first-child { opacity: .65; width: 90px; }
      textarea { width: 100%; box-sizing: border-box; height: 90px; background: #0f1420; color: #e8ecf3; border: 1px solid #34405a; border-radius: 4px; padding: 6px; font: inherit; resize: vertical; }
      .verdict { display: flex; gap: 4px; } .verdict button { flex: 1; }
      #timeline { width: 100%; }
    </style>
  </head>
  <body>
    <div id="side">
      <header>
        <b>宝可梦模型展示台</b>
        <input id="q" placeholder="搜索 编号 / 中文名 / 英文名" />
        <select id="filter">
          <option value="all">全部</option><option value="todo">未核对</option><option value="ok">✅ 通过</option><option value="bad">❌ 需修改</option><option value="new">本次新增 17 种</option>
        </select>
        <div id="stats"></div>
      </header>
      <div id="list"></div>
    </div>
    <div id="view"></div>
    <div id="title"><b id="tname">加载中…</b><div id="tsub"></div></div>
    <div id="help">左键拖动旋转 · 右键平移 · 滚轮缩放 · ↑/↓ 切换宝可梦 · ←/→ 切换动画 · 空格 暂停 · 1 通过 · 2 需修改 · F 重置镜头</div>
    <div id="panel">
      <h3>动画片段</h3>
      <div class="clips" id="clips"></div>
      <div class="row" style="margin-top:8px"><button id="play">⏸ 暂停</button><input id="timeline" type="range" min="0" max="1000" value="0" /></div>
      <div class="row"><label>速度 <span id="spdv">1.0×</span></label><input id="spd" type="range" min="0.1" max="2" step="0.1" value="1" /></div>
      <div class="row"><label>命中帧</label><span id="hit">—</span></div>
      <h3>显示</h3>
      <div class="clips">
        <button id="tShiny">异色</button><button id="tToon" class="on">Toon 着色</button><button id="tWire">线框</button><button id="tBones">骨骼</button>
        <button id="tRef" class="on">1.6 m 参照人</button><button id="tSpin">自动旋转</button><button id="tSky">背景切换</button>
      </div>
      <div class="clips" style="margin-top:6px">
        <button data-v="front">正面</button><button data-v="side">侧面</button><button data-v="back">背面</button><button data-v="q34">3/4</button><button data-v="top">俯视</button>
      </div>
      <h3>模型信息</h3>
      <table id="info"></table>
      <h3>核对结论</h3>
      <div class="verdict"><button id="vOk">✅ 通过</button><button id="vBad">❌ 需修改</button><button id="vClear">清除</button></div>
      <textarea id="note" placeholder="问题描述（自动保存在本浏览器），例如：耳朵太短 / 尾巴穿模 / walk 动画脚滑"></textarea>
      <div class="clips" style="margin-top:6px"><button id="copy">复制全部核对结果</button><button id="dl">下载为 Markdown</button></div>
      <div id="copied" style="font-size:12px;opacity:.7;margin-top:4px"></div>
    </div>
    <script type="module" src="/src/devtools/modelViewer.ts"></script>
  </body>
</html>
